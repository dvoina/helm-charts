name: Build and publish Helm chart (OCI)

on:
  push:
    branches: [ main ]
    paths:
      - 'ckan/**'
      - '.github/workflows/helm-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Package and publish chart to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HELM_EXPERIMENTAL_OCI: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'
      - name: Force-install Helm v3.12.0 (ensure CLI with OCI)
        run: |
          echo "Installing Helm v3.12.0 via official script to ensure correct binary"
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod +x get_helm.sh
          ./get_helm.sh --version v3.12.0
        shell: bash

      - name: Debug Helm binary
        run: |
          echo "Which helm: $(which helm || true)"
          helm version --short || true
          echo "-- helm help summary --"
          helm --help | head -n 80 || true
          echo "-- helm commands containing 'chart' or 'registry' --"
          helm help | grep -E "chart|registry" || true
        shell: bash

      - name: Ensure chart dependencies
        run: |
          if [ -d ckan ]; then
            helm dependency update ckan || true
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: |
          mkdir -p charts
          helm package ckan --destination charts

      - name: Extract chart version
        id: chart_version
        run: |
          VERSION=$(grep '^version:' ckan/Chart.yaml | head -1 | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Save & push chart to GHCR (OCI)
        run: |
          VERSION=${{ steps.chart_version.outputs.version }}
          CHART_NAME=$(ls charts | grep ckan | head -n1 | sed 's/\.tgz$//')
          export HELM_EXPERIMENTAL_OCI=1
          # Resolve a helm binary that supports the 'chart' subcommand
          HELM_BIN=$(which helm || true)
          if [ -n "$HELM_BIN" ]; then
            if ! $HELM_BIN help chart >/dev/null 2>&1; then
              if [ -x /usr/local/bin/helm ]; then
                HELM_BIN=/usr/local/bin/helm
              elif [ -x /home/runner/.local/bin/helm ]; then
                HELM_BIN=/home/runner/.local/bin/helm
              fi
            fi
          else
            # fallback
            HELM_BIN=/usr/local/bin/helm
          fi
          echo "Using helm: $HELM_BIN"
          $HELM_BIN version --short || true
          $HELM_BIN help | head -n 40 || true
          $HELM_BIN chart save ckan oci://ghcr.io/${{ github.repository_owner }}/ckan:${VERSION}
          $HELM_BIN chart push oci://ghcr.io/${{ github.repository_owner }}/ckan:${VERSION}

      - name: Output published reference
        run: |
          echo "Published: oci://ghcr.io/${{ github.repository_owner }}/ckan:${{ steps.chart_version.outputs.version }}"
