name: Build and publish Helm charts (OCI & Artifact Hub)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  HELM_EXPERIMENTAL_OCI: 1

jobs:
  publish:
    name: Package and publish all charts to GHCR & GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '4.0.0'

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish all charts
        run: |
          mkdir -p charts
          
          # Find all directories containing Chart.yaml (charts are at top level)
          for chart_dir in $(find . -maxdepth 2 -name 'Chart.yaml' -type f | xargs -I {} dirname {} | sed 's|^\./||' | sort); do
            [ "$chart_dir" = "." ] && continue
            
            echo "Processing chart: $chart_dir"
            
            # Update chart dependencies
            helm dependency update "$chart_dir" || true
            
            # Package chart and capture output
            PACKAGE_OUTPUT=$(helm package "$chart_dir" --destination charts 2>&1)
            
            # Extract chart name and version, removing all whitespace
            CHART_NAME=$(grep '^name:' "$chart_dir/Chart.yaml" | head -1 | awk '{print $2}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            VERSION=$(grep '^version:' "$chart_dir/Chart.yaml" | head -1 | awk '{print $2}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            
            # Extract packaged file from helm output
            CHART_TGZ=$(echo "$PACKAGE_OUTPUT" | grep -oP 'saved it to: \K.*' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            
            if [ -z "$CHART_TGZ" ] || [ ! -f "$CHART_TGZ" ]; then
              echo "Error: Could not find packaged chart for $CHART_NAME"
              echo "Package output: $PACKAGE_OUTPUT"
              exit 1
            fi
            
            echo "Publishing $CHART_NAME version $VERSION"
            echo "Chart file: $CHART_TGZ"
            
            # Push to GHCR (OCI)
            helm push "$CHART_TGZ" "oci://ghcr.io/${{ github.repository_owner }}/${CHART_NAME}"
            echo "Published to GHCR: oci://ghcr.io/${{ github.repository_owner }}/${CHART_NAME}:${VERSION}"
          done

      - name: Generate chart list
        id: chart_list
        run: |
          echo "content<<EOF" >> $GITHUB_OUTPUT
          if [ -f charts/*.tgz ]; then
            for chart_tgz in charts/*.tgz; do
              CHART_NAME=$(basename "$chart_tgz" | sed 's/-[^-]*\.tgz$//')
              echo "- \`$CHART_NAME\`" >> $GITHUB_OUTPUT
            done
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create/Update GitHub Releases for Artifact Hub
        uses: softprops/action-gh-release@v1
        with:
          files: charts/*.tgz
          draft: false
          prerelease: false
          tag_name: helm-charts-${{ github.run_number }}
          body: |
            Helm charts packaged and ready for deployment.
            
            **Available Charts:**
            ${{ steps.chart_list.outputs.content }}
            
            Charts can be used with Artifact Hub or installed directly with Helm.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
