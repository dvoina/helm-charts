name: Build and publish Helm chart (OCI)

on:
  push:
    branches: [ main ]
    paths:
      - 'ckan/**'
      - '.github/workflows/helm-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    name: Package and publish chart to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HELM_EXPERIMENTAL_OCI: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Ensure chart dependencies
        run: |
          if [ -d ckan ]; then
            helm dependency update ckan || true
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: |
          mkdir -p charts
          helm package ckan --destination charts

      - name: Extract chart version
        id: chart_version
        run: |
          VERSION=$(grep '^version:' ckan/Chart.yaml | head -1 | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Save & push chart to GHCR (OCI)
        run: |
          VERSION=${{ steps.chart_version.outputs.version }}
          CHART_NAME=$(ls charts | grep ckan | head -n1 | sed 's/\.tgz$//')
          helm chart save ckan oci://ghcr.io/${{ github.repository_owner }}/ckan:${VERSION}
          helm chart push oci://ghcr.io/${{ github.repository_owner }}/ckan:${VERSION}

      - name: Output published reference
        run: |
          echo "Published: oci://ghcr.io/${{ github.repository_owner }}/ckan:${{ steps.chart_version.outputs.version }}"
