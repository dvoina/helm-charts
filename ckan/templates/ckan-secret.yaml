{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ckan.fullname" . }}-secrets
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
type: Opaque
data:
  secret_key: {{ .Values.secrets.secretKey | b64enc | quote }}
  beaker_session_secret: {{ .Values.secrets.beakerSessionSecret | b64enc | quote }}
{{- end -}}
