apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ckan.fullname" . }}-redis
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "ckan.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "ckan.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - containerPort: 6379
              name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ckan.fullname" . }}-redis
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "ckan.fullname" . }}-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
