apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ckan.fullname" . }}-postgres
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "ckan.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "ckan.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | quote }}
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: pg-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: pg-data
          emptyDir: {}
        - name: pg-init
          configMap:
            name: {{ include "ckan.fullname" . }}-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ckan.fullname" . }}-postgres
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "ckan.fullname" . }}-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ckan.fullname" . }}-postgres-init
  labels:
    {{- include "ckan.labels" . | nindent 4 }}
data:
  01-create-datastore.sql: |
    CREATE DATABASE {{ .Values.postgres.datastoreDb }};
    CREATE USER {{ .Values.postgres.roUser }} WITH PASSWORD '{{ .Values.postgres.roPassword }}';
    GRANT CONNECT ON DATABASE {{ .Values.postgres.datastoreDb }} TO {{ .Values.postgres.roUser }};
    \c {{ .Values.postgres.datastoreDb }}
    GRANT USAGE ON SCHEMA public TO {{ .Values.postgres.roUser }};
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO {{ .Values.postgres.roUser }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO {{ .Values.postgres.roUser }};
